[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rea-audio"
version = "0.1.0"
description = "Reverse-engineer any audio: tempo, key, chords, structure, AI-generation verdict — every conclusion carries evidence."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "rea-audio contributors" }]
keywords = ["reverse-engineering", "audio", "music", "ai-detection", "forensics", "suno", "rea"]
classifiers = [
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.8",
]
dependencies = ["numpy>=1.20", "soundfile>=0.12", "jinja2>=3.0"]

[project.optional-dependencies]
ml = ["demucs"]  # optional stem separation, used when present

[project.scripts]
rea-audio = "rea_audio.__main__:main"

[tool.setuptools.packages.find]
include = ["rea_audio*"]
